#  Template NodeJS build
#  This template allows you to validate your NodeJS code.
#  The workflow allows running tests and code linting on the default branch.
image: ubuntu:22.04
options:
  docker: true
  size: 2x
definitions:
  services:
    docker:
      memory: 4096
pipelines:
  custom:
    INT-PREVIEW:
      - step:
          name: Build Image INT Preview
          script:
            - export environment=int
            - export env=preview
            - export namespace=$INT_NAMESPACE
            - export image=$INT_ACR_REGISTRY_URL/fe-elec/essilor-luxottica-internal:latest-$env
            - export app_name=essilor
            
            - echo "environment=$environment" > build.env
            - echo "env=$env" >> build.env
            - echo "namespace=$namespace" >> build.env
            - echo "image=$image" >> build.env
            - echo "app_name=$app_name" >> build.env

            - rm -f ./config_transitions.json
            - cp -f ./build-scripts/${environment}/${env}_config_transitions.json ./config_transitions.json
            - cat ./config_transitions.json                      

            - docker login $INT_ACR_REGISTRY_URL -u $INT_ACR_USERNAME -p $INT_ACR_PASSWORD
            - docker build -t $image .
            - docker push $image
          artifacts:
            - build.env  

      - step:
          name: Deploy INT Preview
          script:
            - apt-get update && apt-get install -y jq sudo curl
            - apt-get install -y gettext -y
            - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl.sha256"
            - echo "$(cat kubectl.sha256) kubectl" | sha256sum --check
            - sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            - kubectl version --client --output=yaml
            - curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                         
            - az login --service-principal -u $INT_AZ_SP_USERNAME -p $INT_AZ_SP_PASSWORD --tenant $AZ_TENANT_ID
            - az aks get-credentials -n $INT_AKS -g $INT_RG --admin
            
            - source build.env
            - export $(cat build.env | xargs) 
            - env | grep -E 'environment|env|namespace|image|app_name'
            
            # Read value from config.json
            - export config_GRAPHQL_URL=$(jq -r '.GRAPHQL_URL' ./build-scripts/${environment}/${env}_config_transitions.json)
            - export config_AKAMAY_PATH=$(jq -r '.AKAMAY_PATH' ./build-scripts/${environment}/${env}_config_transitions.json)
            - env | grep -E 'config_GRAPHQL_URL|config_AKAMAY_PATH'

            - envsubst < ./build-scripts/manifests/configmap.yml > ./build-scripts/manifests/aks_configmap.yml   
            - envsubst < ./build-scripts/manifests/charttemplate.yml > ./build-scripts/manifests/Chart.yaml            
            
            - cat ./build-scripts/manifests/aks_configmap.yml
            - kubectl apply -f ./build-scripts/manifests/aks_configmap.yml 
            - cat ./build-scripts/manifests/templates/01-deployment.yml 
            - cat ./build-scripts/manifests/templates/02-service.yml 

            # Install Helm
            - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            - chmod +x get_helm.sh
            - ./get_helm.sh
            - helm version          
            - > 
              helm upgrade --install -n $namespace $app_name-fe-$env 
              --set fe_image=$image,app_name=$app_name
              -f ./build-scripts/manifests/values/$environment-$env.yml 
              -f ./build-scripts/manifests/secrets/$env.yml ./build-scripts/manifests

    INT-LIVE:
      - step:
          name: Build Image INT Live
          script:
            - export environment=int
            - export env=live
            - export namespace=$INT_NAMESPACE
            - export image=$INT_ACR_REGISTRY_URL/fe-elec/essilor-luxottica-internal:latest-$env
