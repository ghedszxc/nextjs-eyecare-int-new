            - export config_AKAMAY_PATH=$(jq -r '.AKAMAY_PATH' ./build-scripts/${environment}/${env}_config_transitions.json)
            - env | grep -E 'config_GRAPHQL_URL|config_AKAMAY_PATH'

            - envsubst < ./build-scripts/manifests/configmap.yml > ./build-scripts/manifests/aks_configmap.yml   
            - envsubst < ./build-scripts/manifests/charttemplate.yml > ./build-scripts/manifests/Chart.yaml            
            
            - cat ./build-scripts/manifests/aks_configmap.yml
            - kubectl apply -f ./build-scripts/manifests/aks_configmap.yml 
