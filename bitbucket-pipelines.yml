            - chmod +x get_helm.sh
            - ./get_helm.sh
            - helm version          
            - > 
              helm upgrade --install -n $namespace $app_name-fe-$env 
              --set fe_image=$image,app_name=$app_name
              -f ./build-scripts/manifests/values/$environment-$env.yml 
              -f ./build-scripts/manifests/secrets/$env.yml ./build-scripts/manifests   
  
